name: "🐾 Register an Animal (XMR Bounty)"
description: "Register a new animal without publishing precise location or payment data"
title: "[ANIMAL] Species Name - Country/Region"
labels: ["🐾 animal-registration"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐾 Register an Animal on MyZubster

        **Reward:** 0.001 XMR for each verified registration, subject to the current bounty policy.

        This issue is public. Do not include exact coordinates, a home address, an animal owner's address, a wildlife nesting/den location, or a Monero wallet address. Remove GPS/EXIF metadata from photos before uploading them. Payment details are requested privately only after verification.

  - type: dropdown
    id: animal_type
    attributes:
      label: "🐾 Animal Type"
      options:
        - "Pet (dog, cat, bird, etc.)"
        - "Livestock (cow, pig, sheep, etc.)"
        - "Wildlife (elephant, tiger, etc.)"
        - "Aquatic (fish, dolphin, etc.)"
        - "Insect (bee, butterfly, etc.)"
    validations:
      required: true

  - type: input
    id: species
    attributes:
      label: "🔬 Species Name"
      placeholder: "Canis lupus familiaris"
    validations:
      required: true

  - type: input
    id: common_name
    attributes:
      label: "📝 Common Name"
      placeholder: "Dog"
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: "🌍 Country"
      description: "Country only; this value will be public."
      placeholder: "Italy"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: "🗺️ Region or broad area"
      description: "Optional. Do not enter a street, exact coordinates, or a sensitive habitat."
      placeholder: "Emilia-Romagna"

  - type: dropdown
    id: location_visibility
    attributes:
      label: "🔒 Location visibility for the registry"
      description: "Private is required for pets at home, endangered species, nests, dens, and other sensitive observations."
      options:
        - "Private — country only (recommended)"
        - "Approximate — broad region only"
    validations:
      required: true

  - type: input
    id: age
    attributes:
      label: "📅 Estimated Age"
      placeholder: "3 years"

  - type: input
    id: weight
    attributes:
      label: "⚖️ Weight (kg)"
      placeholder: "25"

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      placeholder: "Describe the animal, its behavior and non-sensitive habitat information."

  - type: textarea
    id: photos
    attributes:
      label: "📸 Photos"
      description: "Remove GPS/EXIF metadata and identifying home details before sharing."
      placeholder: "https://imgur.com/..."

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: "🔐 Privacy confirmation"
      options:
        - label: "I removed exact location, home/address details, wallet addresses, and photo GPS/EXIF metadata from this public issue."
          required: true

  - type: markdown
    attributes:
      value: |
        ### Payment privacy

        Never post a Monero address in this issue. If the registration is approved for a bounty, maintainers will request payment details through a private, verified channel.
