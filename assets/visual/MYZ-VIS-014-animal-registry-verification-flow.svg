<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">MyZubster animal registry verification flow</title><desc id="desc">Evidence-first flow from observation and structured animal record through NFC payload decoding to an explicit registry provider verification result, with privacy and external settlement kept separate.</desc><rect width="1600" height="760" rx="32" fill="#07111f"/><g font-family="Arial,sans-serif"><text x="70" y="80" font-size="44" font-weight="700" fill="#fff">MYZUBSTER // ANIMAL REGISTRY</text><text x="70" y="118" font-size="19" fill="#55f2ff">OBSERVATION · NFC · EXPLICIT VERIFICATION · PRIVACY BY DESIGN</text><g fill="#0d2032" stroke="#42e8ff" stroke-width="3"><rect x="70" y="205" width="250" height="120" rx="18"/><rect x="390" y="205" width="250" height="120" rx="18"/><rect x="710" y="205" width="250" height="120" rx="18"/><rect x="1030" y="205" width="250" height="120" rx="18"/><rect x="1340" y="205" width="190" height="120" rx="18"/></g><g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="195" y="252">OBSERVATION</text><text x="515" y="252">STRUCTURED RECORD</text><text x="835" y="252">NFC PAYLOAD</text><text x="1155" y="252">REGISTRY PROVIDER</text><text x="1435" y="252">RESULT</text></g><g fill="#a8d4db" font-size="16" text-anchor="middle"><text x="195" y="286">minimal necessary data</text><text x="515" y="286">species · category · ID</text><text x="835" y="286">myzubster:nfc:v1:</text><text x="1155" y="286">explicit source of truth</text><text x="1435" y="286">verified / rejected</text></g><g stroke="#ff4de1" stroke-width="4"><path d="M320 265H390"/><path d="M640 265H710"/><path d="M960 265H1030"/><path d="M1280 265H1340"/></g><rect x="170" y="430" width="1260" height="190" rx="24" fill="#160c22" stroke="#ff4de1" stroke-width="3"/><text x="800" y="480" text-anchor="middle" font-size="24" font-weight="700" fill="#ff72e8">EVIDENCE BOUNDARY</text><text x="800" y="525" text-anchor="middle" font-size="19" fill="#fff">NFC TAG EXISTS ≠ ANIMAL IDENTITY INDEPENDENTLY VERIFIED</text><text x="800" y="562" text-anchor="middle" font-size="17" fill="#b7d2d8">Decoded payload is evidence supplied to a verifier. Provider contract and verification result must remain explicit.</text><text x="800" y="596" text-anchor="middle" font-size="17" fill="#b7d2d8">Do not expose unnecessary owner/contact data, private home locations, or sensitive wildlife locations.</text><text x="800" y="690" text-anchor="middle" font-size="17" fill="#55f2ff">External XMR/token settlement is a separate independently verified boundary; merge or registry state is not proof of payment.</text></g></svg>