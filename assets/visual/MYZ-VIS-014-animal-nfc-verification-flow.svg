<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">MyZubster animal NFC verification flow</title><desc id="desc">Documentation diagram separating animal observation, registry record, NFC payload, decoding, provider verification and independently verified result.</desc><rect width="1600" height="760" rx="32" fill="#07111f"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#fff">MYZUBSTER // ANIMAL REGISTRY</text><text x="70" y="120" font-family="Arial,sans-serif" font-size="19" fill="#55f2ff">NFC IS A CARRIER · VERIFICATION REQUIRES A SOURCE OF TRUTH</text><g fill="#102338" stroke="#45eaff" stroke-width="3"><rect x="55" y="230" width="220" height="120" rx="18"/><rect x="315" y="230" width="220" height="120" rx="18"/><rect x="575" y="230" width="220" height="120" rx="18"/><rect x="835" y="230" width="220" height="120" rx="18"/><rect x="1095" y="230" width="220" height="120" rx="18"/><rect x="1355" y="230" width="190" height="120" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="21" font-weight="700"><text x="165" y="280">OBSERVATION</text><text x="425" y="280">REGISTRY RECORD</text><text x="685" y="280">NFC PAYLOAD</text><text x="945" y="280">DECODE</text><text x="1205" y="280">PROVIDER CHECK</text><text x="1450" y="280">RESULT</text></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#a8d4db" font-size="15"><text x="165" y="315">minimum necessary data</text><text x="425" y="315">structured metadata</text><text x="685" y="315">myzubster:nfc:v1:</text><text x="945" y="315">evidence only</text><text x="1205" y="315">configured source of truth</text><text x="1450" y="315">explicit status</text></g><g stroke="#ff4de1" stroke-width="4"><path d="M275 290H315"/><path d="M535 290H575"/><path d="M795 290H835"/><path d="M1055 290H1095"/><path d="M1315 290H1355"/></g><rect x="180" y="470" width="1240" height="165" rx="22" fill="#170c22" stroke="#ff4de1" stroke-width="3"/><text x="800" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ff70e8">EVIDENCE BOUNDARY</text><text x="800" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#fff">NFC TAG EXISTS ≠ ANIMAL IDENTITY INDEPENDENTLY VERIFIED</text><text x="800" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#a8d4db">Verification depends on the configured registry provider and an explicit verification result.</text><text x="800" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#55f2ff">DOCUMENTATION_VISUAL · privacy-aware · no unnecessary owner or sensitive wildlife location data</text></svg>